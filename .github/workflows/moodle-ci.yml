name: Moodle plugin CI
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  moodle:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_405_STABLE
            php: '8.1'
          - moodle: MOODLE_500_STABLE
            php: '8.2'
          - moodle: MOODLE_501_STABLE
            php: '8.2'
          - moodle: MOODLE_502_STABLE
            php: '8.3'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EduardoKrausME/moodle-plugin-validate
          ref: master
          path: validate
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pgsql, mysqli, zip, gd, sodium
          ini-values: max_input_vars=5000
          coverage: none
      - name: Finalization runner (normalization plus all project validators)
        run: |
          python3 validate/.chatgpt/run.py "$GITHUB_WORKSPACE/plugin"
          python3 validate/.chatgpt/run.py --check "$GITHUB_WORKSPACE/plugin"
          git -C plugin diff --exit-code
      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle
        env:
          MOODLE_BRANCH: ${{ matrix.moodle }}
          DB: pgsql
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
      - name: Moodle CI checks
        env:
          MOODLE_BRANCH: ${{ matrix.moodle }}
          DB: pgsql
        run: |
          moodle-plugin-ci phplint
          moodle-plugin-ci validate
          moodle-plugin-ci mustache
          moodle-plugin-ci phpcs --max-warnings 0
          moodle-plugin-ci phpunit --fail-on-warning
          moodle-plugin-ci behat --profile default
